services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: subtext_course
      POSTGRES_USER: subtext_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subtext_demo -d subtext_course"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  serve:
    image: ${SERVE_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.serve
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://subtext_demo:${POSTGRES_PASSWORD}@db:5432/subtext_course
      IMAGE_DIGEST: ${SERVE_IMAGE}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1536m
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - serve
    mem_limit: 128m

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
