fine_to_broad:
  affective_outcome: affective
  affective_tone: affective
  sensory_visual: sensory
  sensory_pacing: sensory
  person_actor: person
  person_director: person
  similarity_plot: similarity
  similarity_vibe: similarity
  attribute_genre: attribute
  attribute_era: attribute
  attribute_language_country: attribute
  negation_genre: negation
  negation_content: negation
  thematic_plot: thematic

broad_categories:
  - affective
  - sensory
  - person
  - similarity
  - attribute
  - negation
  - thematic

compound_rule:
  description: "Derived property rather than a separate hiding label: is_compound = len(set(broad_labels)) >= 2."
  min_distinct_broad_categories: 2

ambiguity_and_unsupported_rules:
  overlap: "Assign all applicable fine labels independently; e.g., genre + excluded content + tone produces [attribute_genre, negation_content, affective_tone]."
  similarity_split: "Use similarity_plot when referencing story/premise mechanics ('twist like Knives Out'); use similarity_vibe when referencing mood/aesthetic ('atmosphere like Lost in Translation'). Both may co-occur."
  false_negation: "Phrases like 'no idea what to watch' or 'without a doubt' are discourse filler, not negation_genre or negation_content."
  unsupported_filters: "Runtime limits, streaming providers, age ratings, and budget are outside the bounded v1.0 extraction contract and remain unspecified."

