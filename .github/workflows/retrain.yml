name: Retrain Challenger

on:
  workflow_dispatch:
    inputs:
      batch_path:
        description: Reviewed drift batch JSONL path
        required: true
        default: data/demo_batches/d2_drift_batch_reviewed.jsonl
        type: string
      epochs:
        description: Fine-tuning epochs
        required: true
        default: '12'
        type: string
      register_challenger:
        description: Register challenger in MLflow if evaluation gates pass
        required: true
        default: true
        type: boolean
  repository_dispatch:
    types: [drift-alert]

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ml.txt

      - name: Install ML dependencies
        run: python -m pip install -r requirements-ml.txt

      - name: Pull DVC datasets and champion bundle
        run: |
          python -m dvc remote modify origin --local auth basic
          python -m dvc remote modify origin --local user "$MLFLOW_TRACKING_USERNAME"
          python -m dvc remote modify origin --local password "$MLFLOW_TRACKING_PASSWORD"
          python -m dvc pull \
            data/raw/d1_queries.jsonl.dvc \
            data/demo_batches/d2_drift_batch_reviewed.jsonl.dvc \
            data/processed/train.jsonl \
            data/processed/val.jsonl \
            data/processed/course_regression.jsonl \
            artifacts/primary/encoder \
            artifacts/primary/head.pt

      - name: Run challenger retraining & gate comparison
        run: |
          BATCH="${{ github.event.inputs.batch_path || github.event.client_payload.batch_path || 'data/demo_batches/d2_drift_batch_reviewed.jsonl' }}"
          EPOCHS="${{ github.event.inputs.epochs || '12' }}"
          EXTRA_FLAG=""
          if [ "${{ github.event.inputs.register_challenger }}" = "false" ]; then
            EXTRA_FLAG="--no-register"
          fi
          python -m ml.retrain --batch "$BATCH" --epochs "$EPOCHS" $EXTRA_FLAG
          python -m ml.gate \
            --champion artifacts/primary/metrics.json \
            --candidate artifacts/challenger/metrics.json \
            --config configs/gates.yaml \
            --validation-report data/manifests/validation_report.json \
            --out challenger_gate_report.json

      - name: Summarize retraining decision
        if: always()
        run: |
          python - << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("evidence/d2/retrain_comparison.json")
          if p.exists():
              c = json.loads(p.read_text())
              print(f"## Challenger Retraining ({c['decision']})")
              print(f"- Champion v{c['champion_version']} run `{c['champion_run_id']}`")
              print(f"- Challenger v{c['challenger_version']} run `{c['challenger_run_id']}`")
              print(f"- Gate passed: `{c['gate_passed']}`")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrain-comparison
          path: |
            evidence/d2/retrain_comparison.json
            challenger_gate_report.json
          if-no-files-found: warn
