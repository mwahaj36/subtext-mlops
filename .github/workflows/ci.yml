name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest ruff
      - run: ruff check backend/
      - run: pytest backend/tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  ml-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 pytest ruff
      - run: ruff check ml/gate.py tests/test_d2_gates.py
      - run: pytest tests/test_d2_gates.py -v
      - run: |
          python -m ml.gate \
            --champion artifacts/primary/metrics.json \
            --candidate artifacts/primary/metrics.json \
            --config configs/gates.yaml \
            --validation-report data/manifests/validation_report.json \
            --out gate_report.json
      - name: Append gate report to step summary
        if: always()
        run: |
          python -c "import json, pathlib; p=pathlib.Path('gate_report.json'); print(json.loads(p.read_text())['markdown_summary'] if p.exists() else 'Gate report missing')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-gate-report
          path: gate_report.json
          if-no-files-found: warn
